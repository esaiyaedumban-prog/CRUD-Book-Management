<!DOCTYPE html>
<html>
<head>
    <title>Book Form</title>
</head>
<body>
    <h1>
        {% if Book %}
            Update Book
        {% else %}
            Add Book
        {% endif %}
    </h1>

    <form method="POST">
        {% csrf_token %}

        <label>Title:</label>
        <input type="text" name="Title"
               value="{{ book.Title|default:'' }}" required>
        <br><br>

        <label>Author:</label>
        <input type="Author" name="Author"
               value="{{ book.Author|default:'' }}" required>
        <br><br>

        <label>price:</label>
        <input type="text" name="price"
               value="{{ book.price|default:'' }}" required>
        <br><br>

        <button type="submit">Save Book</button>
    </form>

    <br>
    <a href="{% url 'book_list' %}">Back to List</a>
</body>
</html>
